layer:
  type: Board
  description: AppKit-E8-AIML board setup using M55_HP and Ethos-U85
  for-board: Alif Semiconductor::AppKit-E8-AIML
  for-device: Alif Semiconductor::AE822FA0E5597BS0:M55_HP
  device: :M55_HP

  # Processor features used in this project.
  processor:
    trustzone: off

  # List connections used to identify compatible software layers.
  connections:
    - connect: AppKit-E8-AIML Board
      provides:
        - CMSIS_ETH
        - CMSIS_USART
        - CMSIS_USB_Device
        - CMSIS_VIO
        - CMSIS_VSTREAM_VIDEO_IN
        - CMSIS_VSTREAM_VIDEO_OUT
        - STDIN
        - STDOUT
        - STDERR
        - Heap: 98304
      consumes:
        - CMSIS-RTOS2

  # List of #define statements passed via the command line to the build tool.
  define:
    - CMSIS_target_header: \"AppKit-E8-AIML.h\"
    - ETHOSU85
    # Normally set by the pack ISP component; needed by the local ISP
    # override sources (see the ISP Override group below)
    - RTE_Drivers_ISP

  # Local ISP override headers must shadow the pack's Alif_CMSIS copies;
  # the VeriSilicon ISP library headers come from the pack (normally added
  # by the Device:SOC Peripherals:ISP component, which the override replaces)
  add-path:
    - isp_override
    - $Pack(AlifSemiconductor::Ensemble)$/libs/isp/inc
    - $Pack(AlifSemiconductor::Ensemble)$/libs/isp

  # List the packs used in the layer.
  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-Driver@^2.10.0
    - pack: ARM::ethos-u-core-driver@^1.26.2

  # List miscellaneous options passed via the command line to the build tool.
  misc:
    - for-compiler: AC6
      C-CPP:
        # The prebuilt ISP library (libisp.a) is compiled with packed enums;
        # build the whole image with the same enum ABI so armlink accepts it
        - -fshort-enums
      Link:
        - '--diag_suppress 6312,6314,6329,6848'

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: Device:Startup

    - component: BSP:Board Config
    - component: BSP:AppKit Config&AppKit-E8-AIML
    # BSP:External peripherals:CAMERA Sensor OV5675 replaced by the local
    # override below: pack sensor driver plus an ov5675_isp_param.c carrying
    # the color fixes from alif_ensemble-cmsis-dfp PR #63 (correct GBRG10
    # Bayer format, AWB off with manual CCM) that are not yet in pack 2.2.0
    - component: BSP:External peripherals:Ethernet PHY
    - component: BSP:External peripherals:ILI9806E LCD panel

    - component: CMSIS:CORE

    - component: CMSIS Driver:Ethernet MAC
    - component: CMSIS Driver:Ethernet PHY:Custom
    - component: CMSIS Driver:GPIO
      define:
        - CMSIS_GPIO_DISABLE_EVENTS
    - component: CMSIS Driver:I2C
    - component: CMSIS Driver:SPI
    - component: CMSIS Driver:USART
    - component: CMSIS Driver:USB Device
    - component: CMSIS Driver:VIO:Custom
#   - component: CMSIS Driver:VIO:Board&AppKit-E8-AIML
    - component: CMSIS Driver:vStream:Custom
#   - component: CMSIS Driver:vStream:VideoIn&AppKit-E8-AIML
#   - component: CMSIS Driver:vStream:VideoOut&AppKit-E8-AIML

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom

    - component: Device:SOC Peripherals:CDC
    - component: Device:SOC Peripherals:CPI
    - component: Device:SOC Peripherals:DMA
    - component: Device:SOC Peripherals:GPIO
    # Device:SOC Peripherals:ISP intentionally not selected: with the 2.2.0
    # pack the CSI->ISP->CPI routing wedges after the first frame (the ISP
    # never sees a second v-sync). The OV5675 is captured RAW8 Bayer by the
    # CPI directly and debayered in software; re-add the ISP component and
    # set RTE_ISP=1 / RTE_CPI_ISP_PORT=1 once the fixes from
    # alif_ensemble-cmsis-dfp PR #63 are released in a pack.
    - component: Device:SOC Peripherals:MHU
    - component: Device:SOC Peripherals:MIPI CSI2
    - component: Device:SOC Peripherals:MIPI DSI
    - component: Device:SOC Peripherals:MIPI DSI CSI2 DPHY
    - component: Device:SOC Peripherals:PINCONF

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U85

    - component: Services:Retarget IO:STDERR
    - component: Services:Retarget IO:STDIN
    - component: Services:Retarget IO:STDOUT
    - component: Services:Secure Enclave:core&Source
    - component: Services:Secure Enclave:Initialization Helper&Source

  # List of source groups and files added to a project or a layer.
  groups:
    - group: Board
      files:
        - file: main.c
        - file: main.h
        - file: AppKit-E8-AIML.h
        - file: ethos_setup.c
        - file: retarget_stdio.c
        - file: ext_init.c
        - file: profiler.c
        - file: profiler.h

    - group: Ethos Interface
      files:
        - file: ethosu_cb_dcache.c
        - file: ethosu_cb_os_rtos2.c

    - group: Drivers
      files:
        - file: vio_AppKit-E8-AIML.c
        - file: vstream_video_in.c
        - file: vstream_video_out.c

    # Local override of BSP:External peripherals:CAMERA Sensor OV5675
    # (see comment at the removed component above)
    - group: CameraSensor OV5675 Override
      files:
        - file: OV5675_Camera_Sensor.c

    # Local override of Device:SOC Peripherals:ISP - the pack 2.2.0 ISP
    # driver predates the fixes from alif_ensemble-cmsis-dfp PR #63
    # (runtime centered-square crop, AE tuning, correct GBRG10 sensor
    # format, sensor param cleanup). Sources are pack copies with the PR
    # applied; libisp.a is copied verbatim from the pack.
    - group: ISP Override
      files:
        - file: isp_override/Driver_ISP.c
        - file: isp_override/ov5675_isp_param.c
        - file: isp_override/libisp.a
